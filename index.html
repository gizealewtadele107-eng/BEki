<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ግዛቸው የመኪና እቁብ | Dream Car Lottery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts ለቆንጆ ጽሁፍ -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <div class="logo">ግዛቸው <span>እቁብ</span></div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>የህልምዎን መኪና ዛሬውኑ ያሸንፉ!</h1>
            <p>በታማኝነት እና በፈጣን አሰራር እጣዎን ይቁረጡ።</p>
            <a href="#cars" class="btn-primary">እጣዎችን ይመልከቱ</a>
        </div>
    </header>

    <section id="cars" class="car-section">
        <h2 class="section-title">የምንሰጣቸው መኪናዎች</h2>
        <div class="container">
            <!-- Sino Truck -->
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1586191582056-b8fdbec1e193?q=80&w=600');"></div>
                <div class="card-body">
                    <h3>Sino Truck</h3>
                    <p class="price">3,000 ብር</p>
                    <p>ጠንካራ እና አስተማማኝ። ለስራዎ ተመራጭ መኪና።</p>
                    <a href="https://t.me/Beki20_bot" class="buy-btn">እጣ ቁረጥ</a>
                </div>
            </div>

            <!-- Isuzu -->
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1591136423927-909774618e4e?q=80&w=600');"></div>
                <div class="card-body">
                    <h3>Isuzu NPR</h3>
                    <p class="price">2,000 ብር</p>
                    <p>ለከተማ እና ለረጅም ጉዞ ምቹ የሆነ ዘመናዊ መኪና።</p>
                    <a href="https://t.me/Beki20_bot" class="buy-btn">እጣ ቁረጥ</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 ግዛቸው የመኪና እቁብ | በቴሌግራም ያግኙን: @Beki20_bot</p>
    </footer>

</body>
</html>
